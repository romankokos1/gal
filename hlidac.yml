name: Hlídač čepů – Galerie piva

on:
  schedule:
    # každé 2 hodiny cca 6:17–22:17 českého času (cron je v UTC)
    - cron: "17 4-20/2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hlidac
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Stáhnout a zapsat čepy
        id: scrape
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scrape.py || echo "failed=1" >> "$GITHUB_OUTPUT"

      # Commit proběhne vždy – i když parser selže, uloží se diagnostický snapshot
      - name: Commit změn
        run: |
          git config user.name  "hlidac-bot"
          git config user.email "hlidac-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Nic k commitnutí."
          else
            git commit -m "Čepy $(TZ=Europe/Prague date '+%Y-%m-%d %H:%M')"
            git push
          fi

      - name: Nahlásit selhání parseru
        if: steps.scrape.outputs.failed == '1'
        run: |
          echo "Parser nenašel seznam čepů – viz data/posledni_chyba.html"
          exit 1
