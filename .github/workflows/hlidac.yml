name: Hlídač čepů

# GitHub plánované běhy často zpožďuje o hodiny nebo vynechává, takže půlhodinový
# cron nejde dodržet. Proto jeden běh zůstane aktivní až ~5,5 h a každých 30 min
# sám zkontroluje podniky (který je na řadě, rozhoduje scrape.py podle interval_min:
# Galerie 30 min, ostatní 2 h). Cron ho jen několikrát denně „probudí“.
on:
  schedule:
    # cca 6:05, 9:05, 12:05, 15:05, 18:05, 21:05, 0:05 českého letního času (cron je v UTC)
    - cron: "5 4-22/3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hlidac
  cancel-in-progress: false   # nový běh počká, až starý dohlídá → navazují na sebe

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Hlídat čepy (opakovaně každých 30 min)
        id: scrape
        env:
          RUCNE: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          git config user.name  "hlidac-bot"
          git config user.email "hlidac-bot@users.noreply.github.com"
          start=$(date +%s)
          failed=0
          while true; do
            # vzít případné nové verze skriptu i dat (kdybys mezitím něco nahrál)
            git pull -q --rebase --autostash || true

            if [ "$RUCNE" = "true" ]; then
              python scrape.py --vse || failed=1     # ruční spuštění: všechno hned, jednou
            else
              python scrape.py || failed=1
            fi

            git add -A data/
            if ! git diff --cached --quiet; then
              git commit -q -m "Čepy $(TZ=Europe/Prague date '+%Y-%m-%d %H:%M')"
              for i in 1 2 3; do
                git push -q && break
                git pull -q --rebase --autostash || true
              done
            fi

            [ "$RUCNE" = "true" ] && break
            # skončit po ~5 h (další běh naváže) nebo v noci mezi 1. a 6. hodinou
            hour=$(TZ=Europe/Prague date +%-H)
            if [ $(( $(date +%s) - start )) -gt 18000 ] || { [ "$hour" -ge 1 ] && [ "$hour" -lt 6 ]; }; then
              break
            fi
            sleep 1800
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Nahlásit selhání
        if: steps.scrape.outputs.failed == '1'
        run: |
          echo "Některý podnik selhává déle než tolerance – viz log kroku výše a data/<podnik>/stav.json"
          exit 1
