name: Hlídač čepů

on:
  schedule:
    # každé 2 hodiny cca 6:17–0:17 českého času (cron je v UTC)
    - cron: "17 4-22/2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hlidac
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Stáhnout a zapsat čepy
        id: scrape
        run: python scrape.py || echo "failed=1" >> "$GITHUB_OUTPUT"

      # Commit proběhne vždy – i když některý podnik selže, uloží se stav a diagnostika
      - name: Commit změn
        run: |
          git config user.name  "hlidac-bot"
          git config user.email "hlidac-bot@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "Nic k commitnutí."
          else
            git commit -m "Čepy $(TZ=Europe/Prague date '+%Y-%m-%d %H:%M')"
            git push
          fi

      - name: Nahlásit selhání
        if: steps.scrape.outputs.failed == '1'
        run: |
          echo "Některý podnik selhává déle než ~6 hodin – viz log kroku výše a data/<podnik>/stav.json"
          exit 1
