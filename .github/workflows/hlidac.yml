name: Hlídač čepů

# GitHub plánované běhy (cron) zpožďuje o hodiny nebo úplně vynechává – reálně
# jich přišlo ~3 denně. Proto se hlídač drží sám: jeden běh ~5 h každých 30 min
# kontroluje podniky (kdo je na řadě, rozhoduje scrape.py podle interval_min)
# a na konci sám spustí další běh. Řetěz tak běží nepřetržitě, cron je jen záloha
# pro případ, že se přetrhne. V noci (1–6 h) běh jen čeká a nic nestahuje.
# Veřejné repo má minuty Actions zdarma, takže nepřetržitý běh nic nestojí.
on:
  schedule:
    - cron: "17 */2 * * *"     # záloha; když už běh jede, jen čeká ve frontě
  workflow_dispatch:             # ruční spuštění = hned stáhne všechno a pak normálně hlídá dál

permissions:
  contents: write
  actions: write                 # aby mohl spustit navazující běh

concurrency:
  group: hlidac
  cancel-in-progress: false      # nový běh počká, až starý dohlídá (ve frontě je max. jeden)

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Hlídat čepy (každých 30 min, ~5 h)
        id: scrape
        env:
          RUCNE: ${{ github.event_name == 'workflow_dispatch' && github.actor != 'github-actions[bot]' }}
        run: |
          git config user.name  "hlidac-bot"
          git config user.email "hlidac-bot@users.noreply.github.com"
          start=$(date +%s)
          failed=0
          first=1
          while true; do
            hour=$(TZ=Europe/Prague date +%-H)
            vse=""
            [ "$first" = 1 ] && [ "$RUCNE" = "true" ] && vse="--vse"   # ruční spuštění: hned všechno
            if [ -z "$vse" ] && [ "$hour" -ge 1 ] && [ "$hour" -lt 6 ]; then
              echo "noc – nestahuji"
            else
              # vzít případné nové verze skriptu i dat (kdybys mezitím něco nahrál)
              git pull -q --rebase --autostash || true
              python scrape.py $vse || failed=1

              git add -A data/
              if ! git diff --cached --quiet; then
                git commit -q -m "Čepy $(TZ=Europe/Prague date '+%Y-%m-%d %H:%M')"
                for i in 1 2 3; do
                  git push -q && break
                  git pull -q --rebase --autostash || true
                done
              fi
            fi
            first=0
            [ $(( $(date +%s) - start )) -gt 18000 ] && break    # po ~5 h předat dalšímu běhu
            sleep 1800
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Spustit navazující běh
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run hlidac.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"

      - name: Nahlásit selhání
        if: steps.scrape.outputs.failed == '1'
        run: |
          echo "Některý podnik selhává déle než tolerance – viz log kroku výše a data/<podnik>/stav.json"
          exit 1
