name: Hlídač čepů

on:
  schedule:
    # každých 30 min cca 6–1 h českého času (cron je v UTC); který podnik se stáhne,
    # rozhoduje scrape.py podle interval_min (Galerie 30 min, ostatní 2 h)
    - cron: "17,47 4-22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hlidac
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Stáhnout a zapsat čepy
        id: scrape
        # ruční spuštění (Run workflow) stáhne všechny podniky hned
        run: python scrape.py ${{ github.event_name == 'workflow_dispatch' && '--vse' || '' }} || echo "failed=1" >> "$GITHUB_OUTPUT"

      # Commit proběhne vždy – i když některý podnik selže, uloží se stav a diagnostika
      - name: Commit změn
        run: |
          git config user.name  "hlidac-bot"
          git config user.email "hlidac-bot@users.noreply.github.com"
          git add -A data/
          if git diff --cached --quiet; then
            echo "Nic k commitnutí."
          else
            git commit -m "Čepy $(TZ=Europe/Prague date '+%Y-%m-%d %H:%M')"
            git push
          fi

      - name: Nahlásit selhání
        if: steps.scrape.outputs.failed == '1'
        run: |
          echo "Některý podnik selhává déle než ~6 hodin – viz log kroku výše a data/<podnik>/stav.json"
          exit 1
